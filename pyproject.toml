[project]
name = "miti-chat"
version = "0.3.0"
description = "MITI 4.2.1 coding of general-purpose assistant chats with simulated clients (protocol miti-chat-pilot-0.3), built on Inspect AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.280",
    "openai==3.31.0",
    "anthropic==1.14.0",
    "jsonschema==4.26.0",
    "rapidfuzz==3.14.6",
    "tiktoken==0.14.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
miti = "miti_chat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miti_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
